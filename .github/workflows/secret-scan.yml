# API キー・トークン・パスワードらしき文字列の簡易検出。
#
# これは補助にすぎない。顧客名・社内情報などの「機密だが秘密鍵ではない」情報は
# 検出できないため、最終的には人間のレビューが前提（CONTRIBUTING.md 参照）。
#
# あわせて、GitHub 標準の Secret scanning / Push protection を
# Settings → Code security で有効にしておくことを推奨する（パブリックリポジトリは無償）。

name: secret-scan

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
