name: 既存パターンへの意見
description: 掲載されている知識について、使えた・違和感がある・反例がある、などを伝えます。
title: "[意見] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        掲載されている知識は、検証された正解ではありません。
        **「違和感がある」「自分の状況では成り立たなかった」という報告は、新しい知識の投稿と同じくらい価値があります。**

        ---

        ### ⚠ 公開してはいけない情報を書かないでください

        **顧客名、会社名、個人情報、非公開仕様、内部URL、認証情報、案件固有の詳細など、公開してはいけない情報を書かないでください。実務事例は一般化・抽象化して投稿してください。**

  - type: input
    id: target
    attributes:
      label: 対象パターン
      description: ファイル名またはタイトル。複数でも構いません。
      placeholder: 例) patterns/value-meaning.md （値の意味を問う）
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 意見の種類
      multiple: true
      options:
        - 実際に使えた
        - 違和感がある
        - 反例がある
        - 追加情報がある
        - 関連知識を知っている
        - その他
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: 内容
      description: どんな状況で、何が起きた（起きなかった）かを書いてください。
    validations:
      required: true

  - type: checkboxes
    id: confidentiality
    attributes:
      label: 確認
      options:
        - label: 公開してはいけない情報が含まれていないことを確認しました
          required: true
